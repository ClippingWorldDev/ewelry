<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <!-- Outer Chamfered Hallmark Frame -->
  <polygon
    points="28,10 72,10 90,28 90,72 72,90 28,90 10,72 10,28"
    fill="#0E0E0E"
    stroke="#C5A46D"
    stroke-width="2.5"
    stroke-linejoin="round"
  />

  <!-- Inner Step-Cut Facet (Emerald Cut Table) -->
  <polygon
    points="33,22 67,22 78,33 78,67 67,78 33,78 22,67 22,33"
    fill="none"
    stroke="#C5A46D"
    stroke-width="1.2"
    stroke-opacity="0.65"
    stroke-linejoin="round"
  />

  <!-- Corner Facet Miter Lines -->
  <line x1="10" y1="28" x2="22" y2="33" stroke="#C5A46D" stroke-width="1" stroke-opacity="0.5" />
  <line x1="28" y1="10" x2="33" y2="22" stroke="#C5A46D" stroke-width="1" stroke-opacity="0.5" />
  <line x1="72" y1="10" x2="67" y2="22" stroke="#C5A46D" stroke-width="1" stroke-opacity="0.5" />
  <line x1="90" y1="28" x2="78" y2="33" stroke="#C5A46D" stroke-width="1" stroke-opacity="0.5" />
  <line x1="90" y1="72" x2="78" y2="67" stroke="#C5A46D" stroke-width="1" stroke-opacity="0.5" />
  <line x1="72" y1="90" x2="67" y2="78" stroke="#C5A46D" stroke-width="1" stroke-opacity="0.5" />
  <line x1="28" y1="90" x2="33" y2="78" stroke="#C5A46D" stroke-width="1" stroke-opacity="0.5" />
  <line x1="10" y1="72" x2="22" y2="67" stroke="#C5A46D" stroke-width="1" stroke-opacity="0.5" />

  <!-- Center Diamond Brilliance Star (Haute Joaillerie Sparkle) -->
  <path
    d="M 50 31 Q 50 50 69 50 Q 50 50 50 69 Q 50 50 31 50 Q 50 50 50 31 Z"
    fill="#C5A46D"
  />
  <!-- Secondary Subtle Ray Cross -->
  <line x1="39" y1="39" x2="61" y2="61" stroke="#FAF8F4" stroke-width="1" stroke-opacity="0.75" />
  <line x1="61" y1="39" x2="39" y2="61" stroke="#FAF8F4" stroke-width="1" stroke-opacity="0.75" />

  <!-- Center Pure Sparkle Core -->
  <circle cx="50" cy="50" r="2.2" fill="#FAF8F4" />
</svg>
